[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-lean-bridge"
version = "0.1.0"
description = "Bridges Qiskit's StandardEquivalenceLibrary to formally verified proofs in inQWIRE/LeanQuantum"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rex Rowan" }]
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0",
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["qiskit", "lean4", "formal-verification", "quantum-computing"]

[project.urls]
Homepage = "https://github.com/RexRowan/Qiskit-LEAN-Bridge"
Repository = "https://github.com/RexRowan/Qiskit-LEAN-Bridge"
Issues = "https://github.com/RexRowan/Qiskit-LEAN-Bridge/issues"

[project.scripts]
qlb-extract = "extractor.extract_equivalences:main"
qlb-generate-lean = "extractor.generate_lean:main"
qlb-generate-coverage = "extractor.generate_coverage:main"

[tool.setuptools]
packages = ["extractor"]
