name: bridge-ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-extraction: catches Qiskit releases that add/change
    # equivalences or (per verify_conventions.py) silently change a gate
    # convention we've hard-coded a "direct" mapping against.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # Fast job: pure Python, no Lean toolchain needed. Runs on every push/PR
  # in well under a minute. This is the job that actually catches
  # convention drift and re-generates the coverage report.
  extract-and-verify:
    runs-on: ubuntu-latest
    outputs:
      equivalence_count: ${{ steps.extract.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install qiskit
        run: pip install qiskit --break-system-packages

      - name: Run convention checks
        run: python3 extractor/verify_conventions.py

      - name: Extract equivalences
        id: extract
        run: |
          python3 extractor/extract_equivalences.py data/equivalences.json
          echo "count=$(python3 -c "import json; print(json.load(open('data/equivalences.json'))['equivalence_count'])")" >> "$GITHUB_OUTPUT"

      - name: Diff against last committed snapshot
        run: |
          if git diff --exit-code data/equivalences.json; then
            echo "No change in extracted equivalences."
          else
            echo "::warning::Qiskit's StandardEquivalenceLibrary changed since the last commit. Review the diff and re-run generate_lean.py / generate_coverage.py."
          fi

      - name: Generate Lean stubs + coverage report
        run: |
          python3 extractor/generate_lean.py
          python3 extractor/generate_coverage.py

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-lean-and-coverage
          path: |
            data/equivalences.json
            lean/QiskitEquiv/Generated.lean
            notes/coverage.md

  # Slower job: actually builds the Lean project against LeanQuantum +
  # Mathlib. This needs a real toolchain + dependency cache, so it's kept
  # separate and only runs when the Lean sources changed, to avoid paying
  # a multi-GB Mathlib build on every Python-only commit.
  lean-build:
    runs-on: ubuntu-latest
    needs: extract-and-verify
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.modified, 'lean/')
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build (this pulls Mathlib -- expect several GB and a long first run)
        working-directory: lean
        run: |
          lake update
          lake build

      - name: Count remaining `sorry`s
        working-directory: lean
        run: |
          count=$(grep -c "sorry" QiskitEquiv/Generated.lean || true)
          echo "Open proof obligations (sorry count): $count"
          echo "::notice::$count lemma(s) still need proofs."
